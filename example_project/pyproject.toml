[tool.poetry]
name = "django-localekit-example"
version = "0.1.0"
description = "Example project for django-localekit"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.9"
Django = ">=4.2"
djangorestframework = ">=3.15"
django-localekit = { path = "..", develop = true }

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
